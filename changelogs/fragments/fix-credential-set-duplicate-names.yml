---
bugfixes:
  - orion_credential_set - look up the credential set by name AND credential type, and
    fail with an actionable message when ``credential_name`` matches more than one set of
    the requested ``type``. Previously the lookup was by name alone and returned an
    arbitrary match from an unordered query. Names can repeat across credential types, so
    a set of a different type sharing the name could be returned - skipping creation of
    the requested set, or binding the wrong credential ID to the node. Duplicates of the
    same type can also exist, because Orion's duplicate-name check on create is not atomic
    and concurrent ``state=present`` runs can each create one - the set operated on could
    then change from run to run, updating the keys of one set while nodes stay bound to
    another.
  - orion_credential_set - fix ``state=present`` with ``type=wmi`` always failing with
    ``create_username_password_credentials() missing 1 required positional argument
    'owner'``. The documented ``owner`` suboption of ``wmi`` (and of ``snmpv3``, which was
    silently ignored) is now passed through to the create call.
